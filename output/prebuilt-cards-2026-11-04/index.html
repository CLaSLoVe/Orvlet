<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orvlet · 预置卡片</title><style>*{box-sizing:border-box}body{margin:0;padding:48px 32px;background:#f7f6fa;color:#302e3f;font:15px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1060px;margin:auto}header{display:flex;gap:20px;align-items:start;justify-content:space-between;margin-bottom:40px}h1{font-size:28px;letter-spacing:-.6px;margin:0 0 10px}header p{margin:0;color:#777386;font-size:13px}nav{display:flex;gap:4px;border:1px solid #dedbe6;border-radius:12px;padding:4px}button{border:0;background:transparent;color:inherit;padding:9px 14px;border-radius:8px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#e8e4f2}section{display:grid;grid-template-columns:1fr 1fr;gap:36px 32px}article{min-width:0}h2{font-size:17px;margin:0 0 6px}article p{margin:0 0 18px;color:#777386;font-size:13px;line-height:1.6}img{display:block;width:100%;height:auto}.dark{display:none}body[data-theme=dark]{background:#17161e;color:#f0edf8}body[data-theme=dark] .light{display:none}body[data-theme=dark] .dark{display:block}body[data-theme=dark] button[aria-pressed=true]{background:#393444}body[data-theme=dark] nav{border-color:#45404f}body[data-theme=dark] p{color:#aaa5bb}@media(max-width:700px){body{padding:28px 18px}header{flex-direction:column}section{grid-template-columns:1fr}}</style><body data-theme="light"><main><header><div><h1>Orvlet · 预置卡片</h1><p>实际原生界面截图 · 测试数据 · 2026-11-04</p></div><nav aria-label="预览外观"><button data-theme="light" aria-pressed="true">浅色</button><button data-theme="dark" aria-pressed="false">深色</button></nav></header><section><article><h2>汇率</h2><p>金额输入、币种全名、一键交换，结果和数据日期分层显示。</p><img class="light" src="currency-light.png" alt="汇率浅色原生界面"><img class="dark" src="currency-dark.png" alt="汇率深色原生界面"></article><article><h2>天气</h2><p>地点与温度优先，天气描述和来源作为补充。</p><img class="light" src="weather-light.png" alt="天气浅色原生界面"><img class="dark" src="weather-dark.png" alt="天气深色原生界面"></article><article><h2>时钟</h2><p>突出实时数字，时区与日期保持清晰。</p><img class="light" src="clock-light.png" alt="时钟浅色原生界面"><img class="dark" src="clock-dark.png" alt="时钟深色原生界面"></article><article><h2>音乐</h2><p>曲目和播放状态居首，播放与静音直接操作。</p><img class="light" src="music-light.png" alt="音乐浅色原生界面"><img class="dark" src="music-dark.png" alt="音乐深色原生界面"></article><article><h2>倒计时</h2><p>突出剩余时间，直接暂停和重启。</p><img class="light" src="timer-light.png" alt="倒计时浅色原生界面"><img class="dark" src="timer-dark.png" alt="倒计时深色原生界面"></article><article><h2>日历</h2><p>分别展示日期、时间段、时区与地点。</p><img class="light" src="calendar-light.png" alt="日历浅色原生界面"><img class="dark" src="calendar-dark.png" alt="日历深色原生界面"></article></section></main><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.body.dataset.theme=b.dataset.theme;document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))})</script></body></html>
